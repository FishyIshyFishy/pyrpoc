# Every check. The fast ones also run on each commit (.pre-commit-config.yaml);
# they are repeated here because a local hook can be skipped or not installed.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # The app targets Windows (bundled SDK DLLs), and Qt runs there without a virtual display.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Matches pythonVersion in [tool.pyright], so CI type-checks what Pylance does.
      - run: uv sync --locked --python 3.13
      - name: pre-commit (ruff, import-linter)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: pyright
        run: uv run pyright
