# pyright only: it is too slow for the commit hook, which runs the other checks (.pre-commit-config.yaml).
name: CI

on:
  push:

jobs:
  pyright:
    # The app targets Windows (bundled SDK DLLs).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Matches pythonVersion in [tool.pyright], so CI type-checks what Pylance does.
      - run: uv sync --locked --python 3.13
      - run: uv run pyright
