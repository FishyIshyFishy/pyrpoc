[project]
name = "pyrpoc"
version = "3.1.3"
description = "Real-time Precision Opto-Control Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Ishaan Singh", email = "sing1125@purdue.edu" }
]

dependencies = [
  "opencv-python",
  "pyqt6",
  "PyQt6Ads",
  "pyqtgraph",
  "nidaqmx",
  "tifffile",
  "swabian-timetagger>=2.22.6",
]

[project.scripts]
pyrpoc = "pyrpoc.main:main"

[tool.setuptools.packages.find]
include = ["pyrpoc*"]

# pyrpoc/assets/ is not a package, so its icons ship as data of pyrpoc.
[tool.setuptools.package-data]
pyrpoc = ["assets/*.svg", "assets/*.png"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pyright",
  "ruff",
  "pre-commit",
  "import-linter>=2.15",
]

[tool.pyright]
include = ["pyrpoc"]
exclude = [
  "docs/swabian_demos",
  "rpoc_env",
  "dist",
  "build",
  "**/__pycache__",
  "**/*.egg-info",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
# Problems get fixed, not silenced: `# type: ignore` has no effect, and the
# pre-commit hook rejects `# pyright: ignore` (which this setting cannot turn off).
enableTypeIgnoreComments = false

[tool.ruff]
line-length = 100
extend-exclude = ["docs/swabian_demos", "rpoc_env"]

[tool.ruff.lint]
select = [
  "E", "F",   # basic errors, unused imports and variables
  "I",        # import sorting, plus the required __future__ import (see below)
  "B",        # likely bugs
  "UP",       # modernize syntax; UP037 removes quoted annotations
  "FA",       # flags annotations that need the __future__ import
  "SIM",      # simplifiable code
]
# SIM118 assumes .keys() is a dict's; here it is Registry.keys() and
# catalog.keys(), which support neither `in` nor iteration.
ignore = ["SIM118"]

[tool.ruff.lint.per-file-ignores]
# Generated by the Qt resource compiler.
"pyrpoc/app/gui/theme/breeze_all.py" = ["E501"]

[tool.ruff.lint.isort]
# Every file must start with this (rule I002, auto-fixable). Once it is there,
# quotes around a type name are never needed, and UP037 flags them.
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
line-ending = "lf"

# The architecture, checked by `uv run lint-imports`. Each ignore_imports list
# is a ledger of known debt: delete a line when its import is fixed, and never
# add one to make a new violation pass.
[tool.importlinter]
root_package = "pyrpoc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: app > panels | programs > devices > structs"
type = "layers"
containers = ["pyrpoc"]
layers = ["app", "panels | programs", "devices", "structs"]
ignore_imports = [
  "pyrpoc.panels.** -> pyrpoc.app.model.application",
]

[[tool.importlinter.contracts]]
name = "structs is Qt-free, except panel.py"
type = "forbidden"
source_modules = [
  "pyrpoc.structs.data",
  "pyrpoc.structs.device",
  "pyrpoc.structs.params",
  "pyrpoc.structs.picks",
  "pyrpoc.structs.program",
  "pyrpoc.structs.registries",
  "pyrpoc.structs.runner",
]
forbidden_modules = ["PyQt6", "pyqtgraph"]
ignore_imports = [
  # A type-only import, for the return type of Device.panel().
  "pyrpoc.structs.device -> PyQt6",
]

[[tool.importlinter.contracts]]
name = "Inside app: workspace > gui > model > runtime"
type = "layers"
containers = ["pyrpoc.app"]
layers = ["workspace", "gui", "model", "runtime"]

[[tool.importlinter.contracts]]
name = "runtime knows only structs"
type = "forbidden"
source_modules = ["pyrpoc.app.runtime"]
forbidden_modules = [
  "pyrpoc.panels",
  "pyrpoc.programs",
  "pyrpoc.devices",
  "pyqtgraph",
]

[[tool.importlinter.contracts]]
name = "runtime is Qt-free, except runs.py; the workspace file format is Qt-free"
type = "forbidden"
source_modules = [
  "pyrpoc.app.runtime.claims",
  "pyrpoc.app.runtime.executor",
  "pyrpoc.app.runtime.library",
  "pyrpoc.app.runtime.saving",
  "pyrpoc.app.workspace.file",
]
forbidden_modules = ["PyQt6"]
# Direct imports only: structs.device's type-only Qt import is already on the
# structs ledger above, and reaches these through structs, not through them.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The model holds no widgets"
type = "forbidden"
source_modules = ["pyrpoc.app.model"]
forbidden_modules = ["pyrpoc.panels", "pyqtgraph"]
