[project]
name = "pyrpoc"
version = "3.1.6"
description = "Real-time Precision Opto-Control Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Ishaan Singh", email = "sing1125@purdue.edu" }
]

dependencies = [
  "opencv-python",
  "pyqt6",
  "PyQt6Ads",
  "pyqtgraph",
  "nidaqmx",
  "tifffile",
  "swabian-timetagger>=2.22.6",
]

[project.scripts]
pyrpoc = "pyrpoc.main:main"

[tool.setuptools.packages.find]
include = ["pyrpoc*"]

# pyrpoc/utils/assets/ is not a package, so its icons and DLLs ship as data of pyrpoc.utils.
[tool.setuptools.package-data]
"pyrpoc.utils" = ["assets/*.svg", "assets/*.png", "assets/sdks/*.dll"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pyright",
  "ruff",
  "pre-commit",
  "import-linter>=2.15",
]

[tool.pyright]
include = ["pyrpoc"]
exclude = [
  "docs/swabian_demos",
  "rpoc_env",
  "dist",
  "build",
  "**/__pycache__",
  "**/*.egg-info",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
# Problems get fixed, not silenced: `# type: ignore` has no effect, and the
# pre-commit hook rejects `# pyright: ignore` (which this setting cannot turn off).
enableTypeIgnoreComments = false

[tool.ruff]
line-length = 100
extend-exclude = ["docs/swabian_demos", "rpoc_env"]

[tool.ruff.lint]
select = [
  "E", "F",   # basic errors, unused imports and variables
  "I",        # import sorting, plus the required __future__ import (see below)
  "B",        # likely bugs
  "UP",       # modernize syntax; UP037 removes quoted annotations
  "FA",       # flags annotations that need the __future__ import
  "SIM",      # simplifiable code
]
# SIM118 assumes .keys() is a dict's; here it is Registry.keys() and
# catalog.keys(), which support neither `in` nor iteration.
ignore = ["SIM118"]

[tool.ruff.lint.per-file-ignores]
# Generated by the Qt resource compiler.
"pyrpoc/app/theme/breeze_all.py" = ["E501"]

[tool.ruff.lint.isort]
# Every file must start with this (rule I002, auto-fixable). Once it is there,
# quotes around a type name are never needed, and UP037 flags them.
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
line-ending = "lf"

# The architecture, checked by `uv run lint-imports`. Each ignore_imports list
# is a ledger of known debt: delete a line when its import is fixed, and never
# add one to make a new violation pass.
[tool.importlinter]
root_package = "pyrpoc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: app > engine > plugins > utils > core"
type = "layers"
containers = ["pyrpoc"]
layers = [
  "app",
  "engine",
  "plugins",
  "utils",
  "core",
]

[[tool.importlinter.contracts]]
name = "Inside engine: acquisition > data_library | device_inventory"
type = "layers"
containers = ["pyrpoc.engine"]
layers = ["acquisition", "data_library | device_inventory"]

[[tool.importlinter.contracts]]
name = "Inside plugins: programs and panels use program_io and devices, and never meet"
type = "layers"
containers = ["pyrpoc.plugins"]
layers = ["programs | panels", "program_io | devices"]

[[tool.importlinter.contracts]]
name = "Inside program_io: inputs > outputs"
type = "layers"
containers = ["pyrpoc.plugins.program_io"]
layers = ["inputs", "outputs"]

# Keyed on <name>/program.py, the file every program registers in, so the
# contracts never list the programs themselves.
[[tool.importlinter.contracts]]
name = "Programs never import each other; they share through building_blocks"
type = "independence"
modules = [
  "pyrpoc.plugins.programs.*.program",
  "pyrpoc.plugins.programs.simulated.*.program",
]

[[tool.importlinter.contracts]]
name = "Building blocks never import a program"
type = "forbidden"
source_modules = ["pyrpoc.plugins.programs.building_blocks"]
forbidden_modules = [
  "pyrpoc.plugins.programs.*.program",
  "pyrpoc.plugins.programs.simulated.*.program",
]

[[tool.importlinter.contracts]]
name = "Inside multisite: bindings > routines > stages > interfaces > analysis"
type = "layers"
containers = ["pyrpoc.plugins.programs.building_blocks.multisite"]
layers = ["bindings", "routines", "stages", "interfaces", "analysis"]

[[tool.importlinter.contracts]]
name = "Multisite's stages never import each other"
type = "independence"
modules = [
  "pyrpoc.plugins.programs.building_blocks.multisite.stages.calibration",
  "pyrpoc.plugins.programs.building_blocks.multisite.stages.survey",
  "pyrpoc.plugins.programs.building_blocks.multisite.stages.loop",
]

# Indirect imports are allowed: stages use value types from program_io, whose modules
# import the core. What is forbidden is reaching for a run, a device or an output.
[[tool.importlinter.contracts]]
name = "Only multisite's bindings know runs, devices and program outputs"
type = "forbidden"
source_modules = [
  "pyrpoc.plugins.programs.building_blocks.multisite.analysis",
  "pyrpoc.plugins.programs.building_blocks.multisite.interfaces",
  "pyrpoc.plugins.programs.building_blocks.multisite.stages",
  "pyrpoc.plugins.programs.building_blocks.multisite.routines",
]
forbidden_modules = [
  "pyrpoc.core.program",
  "pyrpoc.core.program_output",
  "pyrpoc.plugins.devices",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Multisite's analysis is maths on arrays: it imports nothing else of pyrpoc"
type = "forbidden"
source_modules = ["pyrpoc.plugins.programs.building_blocks.multisite.analysis"]
forbidden_modules = ["pyrpoc.core", "pyrpoc.utils", "pyrpoc.plugins.program_io", "pyrpoc.plugins.devices"]

[[tool.importlinter.contracts]]
name = "Programs use multisite only through the package root"
type = "forbidden"
source_modules = [
  "pyrpoc.plugins.programs.*.program",
  "pyrpoc.plugins.programs.simulated.*",
]
forbidden_modules = [
  "pyrpoc.plugins.programs.building_blocks.multisite.analysis",
  "pyrpoc.plugins.programs.building_blocks.multisite.interfaces",
  "pyrpoc.plugins.programs.building_blocks.multisite.stages",
  "pyrpoc.plugins.programs.building_blocks.multisite.routines",
  "pyrpoc.plugins.programs.building_blocks.multisite.bindings",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inside the multisite panel: demo > view > overlay | canvas > keys | look | feed > state"
type = "layers"
containers = ["pyrpoc.plugins.panels.multisite"]
layers = ["demo", "view", "overlay | canvas", "keys | look | feed", "state"]

[[tool.importlinter.contracts]]
name = "The engine never names a plugin; it finds plugins through registries"
type = "forbidden"
source_modules = ["pyrpoc.engine"]
forbidden_modules = ["pyrpoc.plugins"]

[[tool.importlinter.contracts]]
name = "core is Qt-free, except panels.py"
type = "forbidden"
source_modules = [
  "pyrpoc.core.registry",
  "pyrpoc.core.device",
  "pyrpoc.core.program",
  "pyrpoc.core.runner",
  "pyrpoc.core.check",
  "pyrpoc.core.program_input",
  "pyrpoc.core.program_output",
  "pyrpoc.core.library",
  "pyrpoc.core.recording",
]
forbidden_modules = ["PyQt6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "The cores are Qt-free: running, the library's store and files, the session file"
type = "forbidden"
source_modules = [
  "pyrpoc.engine.acquisition.claims",
  "pyrpoc.engine.acquisition.executor",
  "pyrpoc.engine.acquisition.readiness",
  "pyrpoc.engine.acquisition.program_inputs",
  "pyrpoc.engine.acquisition.save_target",
  "pyrpoc.engine.data_library.store",
  "pyrpoc.engine.data_library.saving",
  "pyrpoc.engine.data_library.format",
  "pyrpoc.app.session.file",
]
forbidden_modules = ["PyQt6"]

# The application itself is left out: it is the composition root, and importing
# every plugin, display panels included, is how it registers them.
[[tool.importlinter.contracts]]
name = "Engine models hold no widgets: they never import a panel or a widget"
type = "forbidden"
source_modules = [
  "pyrpoc.engine.acquisition.runs",
  "pyrpoc.engine.acquisition.host",
  "pyrpoc.engine.acquisition.events",
  "pyrpoc.engine.data_library.model",
  "pyrpoc.engine.device_inventory.inventory",
]
forbidden_modules = [
  "pyrpoc.engine.acquisition.panel",
  "pyrpoc.engine.data_library.panel",
  "pyrpoc.engine.data_library.details",
  "pyrpoc.engine.device_inventory.panel",
  "pyrpoc.utils.widgets",
  "pyqtgraph",
]

[[tool.importlinter.contracts]]
name = "Inside app: session > window > menubar > theme | application"
type = "layers"
containers = ["pyrpoc.app"]
layers = ["session", "window", "menubar", "theme | application"]
