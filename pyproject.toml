[project]
name = "pyrpoc"
version = "3.1.6"
description = "Real-time Precision Opto-Control Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Ishaan Singh", email = "sing1125@purdue.edu" }
]

dependencies = [
  "opencv-python",
  "pyqt6",
  "PyQt6Ads",
  "pyqtgraph",
  "nidaqmx",
  "tifffile",
  "swabian-timetagger>=2.22.6",
]

[project.scripts]
pyrpoc = "pyrpoc.main:main"

[tool.setuptools.packages.find]
include = ["pyrpoc*"]

# pyrpoc/shared/assets/ is not a package, so its icons and DLLs ship as data of pyrpoc.shared.
[tool.setuptools.package-data]
"pyrpoc.shared" = ["assets/*.svg", "assets/*.png", "assets/sdks/*.dll"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pyright",
  "ruff",
  "pre-commit",
  "import-linter>=2.15",
]

[tool.pyright]
include = ["pyrpoc"]
exclude = [
  "docs/swabian_demos",
  "rpoc_env",
  "dist",
  "build",
  "**/__pycache__",
  "**/*.egg-info",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
# Problems get fixed, not silenced: `# type: ignore` has no effect, and the
# pre-commit hook rejects `# pyright: ignore` (which this setting cannot turn off).
enableTypeIgnoreComments = false

[tool.ruff]
line-length = 100
extend-exclude = ["docs/swabian_demos", "rpoc_env"]

[tool.ruff.lint]
select = [
  "E", "F",   # basic errors, unused imports and variables
  "I",        # import sorting, plus the required __future__ import (see below)
  "B",        # likely bugs
  "UP",       # modernize syntax; UP037 removes quoted annotations
  "FA",       # flags annotations that need the __future__ import
  "SIM",      # simplifiable code
]
# SIM118 assumes .keys() is a dict's; here it is Registry.keys() and
# catalog.keys(), which support neither `in` nor iteration.
ignore = ["SIM118"]

[tool.ruff.lint.per-file-ignores]
# Generated by the Qt resource compiler.
"pyrpoc/app/theme/breeze_all.py" = ["E501"]

[tool.ruff.lint.isort]
# Every file must start with this (rule I002, auto-fixable). Once it is there,
# quotes around a type name are never needed, and UP037 flags them.
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
line-ending = "lf"

# The architecture, checked by `uv run lint-imports`. Each ignore_imports list
# is a ledger of known debt: delete a line when its import is fixed, and never
# add one to make a new violation pass.
[tool.importlinter]
root_package = "pyrpoc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: app > engine > plugins > shared > core"
type = "layers"
containers = ["pyrpoc"]
layers = [
  "app",
  "engine",
  "plugins",
  "shared",
  "core",
]

[[tool.importlinter.contracts]]
name = "Inside engine: acquisition > data_library | device_inventory"
type = "layers"
containers = ["pyrpoc.engine"]
layers = ["acquisition", "data_library | device_inventory"]

[[tool.importlinter.contracts]]
name = "Inside plugins: programs may use devices; programs and panels never meet"
type = "layers"
containers = ["pyrpoc.plugins"]
layers = ["programs | panels", "devices"]

# Keyed on <name>/program.py, the file every program registers in, so the
# contracts never list the programs themselves.
[[tool.importlinter.contracts]]
name = "Programs never import each other; they share through building_blocks"
type = "independence"
modules = [
  "pyrpoc.plugins.programs.*.program",
  "pyrpoc.plugins.programs.simulated.*.program",
]

[[tool.importlinter.contracts]]
name = "Building blocks never import a program"
type = "forbidden"
source_modules = ["pyrpoc.plugins.programs.building_blocks"]
forbidden_modules = [
  "pyrpoc.plugins.programs.*.program",
  "pyrpoc.plugins.programs.simulated.*.program",
]

[[tool.importlinter.contracts]]
name = "The engine never names a plugin; it finds plugins through registries"
type = "forbidden"
source_modules = ["pyrpoc.engine"]
forbidden_modules = ["pyrpoc.plugins"]

[[tool.importlinter.contracts]]
name = "core is Qt-free, except panels.py"
type = "forbidden"
source_modules = [
  "pyrpoc.core.registry",
  "pyrpoc.core.device",
  "pyrpoc.core.program",
  "pyrpoc.core.runner",
  "pyrpoc.core.program_inputs",
  "pyrpoc.core.input_section",
  "pyrpoc.core.data",
  "pyrpoc.core.program_output",
  "pyrpoc.core.library",
  "pyrpoc.core.saving",
]
forbidden_modules = ["PyQt6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "The cores are Qt-free: running, the library's store and files, the session file"
type = "forbidden"
source_modules = [
  "pyrpoc.engine.acquisition.claims",
  "pyrpoc.engine.acquisition.executor",
  "pyrpoc.engine.acquisition.recording",
  "pyrpoc.engine.data_library.store",
  "pyrpoc.engine.data_library.saving",
  "pyrpoc.engine.data_library.format",
  "pyrpoc.app.session.file",
]
forbidden_modules = ["PyQt6"]

# The application itself is left out: it is the composition root, and importing
# every plugin, display panels included, is how it registers them.
[[tool.importlinter.contracts]]
name = "Engine models hold no widgets: they never import a panel or a widget"
type = "forbidden"
source_modules = [
  "pyrpoc.engine.acquisition.model",
  "pyrpoc.engine.acquisition.host",
  "pyrpoc.engine.acquisition.events",
  "pyrpoc.engine.data_library.model",
  "pyrpoc.engine.device_inventory.inventory",
]
forbidden_modules = [
  "pyrpoc.engine.acquisition.panel",
  "pyrpoc.engine.data_library.panel",
  "pyrpoc.engine.data_library.details",
  "pyrpoc.engine.device_inventory.panel",
  "pyrpoc.shared.widgets",
  "pyqtgraph",
]

[[tool.importlinter.contracts]]
name = "Inside app: session > window > menubar > theme | application"
type = "layers"
containers = ["pyrpoc.app"]
layers = ["session", "window", "menubar", "theme | application"]
