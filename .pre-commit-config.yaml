repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0   # or run `uv run pre-commit autoupdate` to get the latest
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-colon-comments
        name: no '#:' comments
        language: pygrep
        entry: '#:'
        types: [python]
      - id: no-type-ignores
        name: no type-checker ignore comments
        language: pygrep
        entry: '(type|pyright):\s*ignore'
        types: [python]
      # Uses the project's pyright and venv, the same configuration Pylance
      # reads from pyproject.toml, so a clean run means no red squiggles.
      - id: pyright
        name: pyright
        language: system
        entry: uv run pyright
        types: [python]
        pass_filenames: false
