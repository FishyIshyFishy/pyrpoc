# Install once with `uv run pre-commit install`. Hooks run from the locked
# environment (uv.lock), so they use the same tool versions as `uv run ...`.

# Vendored example code from Swabian, kept as reference and not held to our rules.
exclude: ^docs/swabian_demos/

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        # --force-exclude: pre-commit passes paths explicitly, and without it
        # ruff ignores its own extend-exclude for those.
        entry: uv run ruff check --fix --force-exclude
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --force-exclude
        types_or: [python, pyi]
      - id: no-type-ignores
        name: no type-checker ignore comments
        language: pygrep
        entry: '(type|pyright):\s*ignore'
        types: [python]
      - id: lint-imports
        name: import-linter
        language: system
        entry: uv run lint-imports
        types: [python]
        pass_filenames: false
      # pyright is slower; it runs in CI (.github/workflows/ci.yml).
